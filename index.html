         them: an achievement counter like "2/7" reads as a date. -->

      name="format-detection"
      content="telephone=no, date=no, address=no, email=no"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
